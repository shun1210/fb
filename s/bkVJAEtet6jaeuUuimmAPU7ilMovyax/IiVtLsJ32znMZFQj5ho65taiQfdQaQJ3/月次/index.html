const dec=new TextDecoder(), enc=new TextEncoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw){
  const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},
    m,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function open_(pw){
  const k=await key(pw);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},k,b64(D.ct));
  document.open(); document.write(dec.decode(buf)); document.close();
}
async function tryOpen(pw,quiet){
  try{ await open_(pw); sessionStorage.setItem('fbpw',pw); return true; }
  catch(e){ if(!quiet){ document.getElementById('err').textContent='パスワードが違います'; }
             sessionStorage.removeItem('fbpw'); return false; }
}
(async()=>{ const s=sessionStorage.getItem('fbpw'); if(s) await tryOpen(s,true); })();
document.getElementById('go').onclick=()=>tryOpen(document.getElementById('pw').value,false);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')
  tryOpen(document.getElementById('pw').value,false);});
