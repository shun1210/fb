<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>内部用 石川大峨</title><style>
:root{--navy:#0b2d6b;--blue:#12459e;--red:#d7000f;--bg:#eef2f8;--ink:#1a2233;--muted:#6b7688;--gld:#e8972e;--good:#12459e;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:'Hiragino Sans',sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.head{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:12px;padding:16px 22px;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:12px}
.head h1{margin:0;font-size:21px} .tagi{background:var(--gld);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:3px 10px}
.head .pd{font-size:12px;opacity:.9;margin-left:auto}
.sechead{font-size:15px;font-weight:800;color:var(--navy);border-left:6px solid var(--red);padding-left:10px;margin:18px 0 7px}
.lvhead{font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--navy),var(--blue));border-radius:10px;padding:9px 15px;margin:22px 0 9px;display:flex;align-items:center;gap:10px}
.lvsub{font-size:11px;font-weight:600;opacity:.85} .lvnote{font-size:11px;font-weight:600;background:rgba(255,255,255,.2);border-radius:5px;padding:2px 8px;margin-left:auto}
.sechead2{font-size:13px;font-weight:800;color:var(--navy);margin:12px 0 5px;padding-left:4px}
.card{background:#fff;border-radius:12px;padding:13px 15px;box-shadow:0 1px 5px rgba(11,45,107,.1)}
.soukatsu{background:linear-gradient(135deg,#fff,#f3f7ff);border-left:5px solid var(--navy);font-size:14px;line-height:1.95;font-weight:600} .soukatsu b{color:var(--navy)}
.conf{border:2px solid var(--gld);box-shadow:0 2px 10px rgba(232,151,46,.2)}
.conft{font-size:15px;font-weight:800;color:var(--navy)} .conft .r{font-size:12px;color:var(--gld);font-weight:800;margin-left:6px}
.conft .dir{font-size:11px;color:#8a93a3;font-weight:500;margin-left:6px}
.ctag{font-size:10px;background:var(--gld);color:#fff;border-radius:5px;padding:2px 7px;margin-right:7px;font-weight:800}
.otag{font-size:10px;background:#8a94a4;color:#fff;border-radius:5px;padding:2px 7px;margin-right:7px;font-weight:800}
.tcard{margin-top:10px} .tcard:not(.conf){opacity:.9}
.conf2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:center;margin-top:8px} @media(max-width:680px){.conf2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px} .kpis.p6{grid-template-columns:repeat(6,1fr)}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)} .kpis.p6{grid-template-columns:repeat(3,1fr)}}
.k{background:#fff;border:1px solid #e1e8f3;border-radius:10px;box-shadow:0 1px 4px rgba(11,45,107,.08);overflow:hidden;display:flex;flex-direction:column}
.kl{font-size:11px;color:#fff;font-weight:800;background:var(--navy);padding:6px 4px;text-align:center;line-height:1.25}
.kbody{flex:1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:5px 7px;padding:11px 6px}
.kv{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1} .kv span{font-size:10px;color:var(--muted);margin-left:1px} .kv .deg{font-size:14px;vertical-align:.45em}
.kpis.p6 .kv{font-size:20px} .kpis.p6 .bd{font-size:9.5px;padding:2px 6px} .kpis.p6 .kbody{padding:10px 4px}
.bd{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap} .bd.up{background:#fbe9eb;color:var(--red)} .bd.down{background:#e6edf7;color:var(--blue)} .bd.neu{background:#eef1f5;color:#5b6472}
img{width:100%;display:block;background:#fff;border:1px solid #dfe5ee;border-radius:8px}
.miss{background:#f5f7fb;border:1px dashed #cbd4e1;border-radius:8px;color:#9aa6b4;text-align:center;padding:40px 0;font-size:12px}
table.mini{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #d7deea;border-radius:9px;overflow:hidden}
table.mini th{background:var(--navy);color:#fff;font-size:11.5px;padding:5px;font-weight:800} table.mini th:last-child{font-weight:500;font-size:10px}
table.mini td{padding:6px;text-align:center;border-top:1px solid #eef1f6;font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums}
td.rg,td.rb,td.rn,td.ru{font-size:11px;font-weight:800} td.rg{color:var(--good);background:#eef2fb} td.rb{color:var(--bad);background:#fbeeec} td.ru{color:#5b6472;background:#f3f5f8} td.rn{color:#2a2f3a;background:#eceef2}
td.vg{color:var(--good)} td.vb{color:var(--bad)} td.vn{background:#f4f6fb} td.vn.near-good{background:#e6edf9;color:var(--good)} td.vn.near-bad{background:#fbeae7;color:var(--bad)}
.note{font-size:11.5px;color:var(--muted);line-height:1.65;margin:4px 0 0}
.note .dot{color:var(--red);font-size:12px;vertical-align:-1px}
.tnote{background:#f3f6fb;border-left:3px solid var(--blue);border-radius:6px;padding:7px 10px;margin:7px 0 0;color:#46506080;color:#4a5568}
.lvtag{display:inline-block;color:#fff;font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:1px}
.guide{background:linear-gradient(135deg,#fff,#f1f6ff);border-left:5px solid var(--gld)} .guide .note{font-size:12px;line-height:1.85} .guide .note b{color:var(--navy)}
.rel{margin-top:10px;border:1px solid #e1e8f3}
.relgrid{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.relcell{background:#fafbfe;border:1px solid #e6ebf4;border-radius:10px;padding:12px 14px}
.relcell .rtitle{font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:7px} .relcell .rtitle::first-letter{color:var(--red)}
.relcell img{border:1px solid #dfe5ee;border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:560px){.two{grid-template-columns:1fr}}
.capt{font-size:11px;color:var(--muted);font-weight:700;text-align:center;margin-bottom:3px}
.now{background:linear-gradient(135deg,#fff,#fff4f1);border:1px solid #f0cabf;border-left:5px solid var(--red);border-radius:9px;padding:9px 12px;margin-top:9px}
.nowt{font-size:10px;font-weight:800;color:var(--red);letter-spacing:.08em} .nowb{font-size:12.5px;line-height:1.7;font-weight:600;margin-top:2px}
.rmiru{font-size:11px;color:#8a94a4;background:#f3f5f9;border:1px solid #eceff4;border-radius:8px;padding:7px 10px;margin-top:7px;line-height:1.6} .rmiru b{color:#6b7688} .warn{color:#b85c33;font-weight:700}
table.mini+table.mini{margin-top:8px}
.foot{text-align:center;color:#9aa6b8;font-size:11px;margin:20px 0 6px}
@page{size:A4 portrait;margin:8mm}
@media print{
  html,body{background:#fff}
  .wrap{max-width:none;width:100%;padding:0;margin:0}
  /* 1ページ=1箱。箱の高さを紙面いっぱいにし、中身を均等配置して余白をセクション間隔として配る */
  .pdfpage{height:281mm;display:flex;flex-direction:column;justify-content:space-evenly;
    break-after:page;page-break-after:always;overflow:hidden}
  .pdfpage:last-child{break-after:auto;page-break-after:auto;height:auto;display:block}
  /* セクション内はタイトル〜本文を密着。余白はセクション(.sec)間だけ */
  .sec>.sechead{margin:0 0 6px} .sec .card{margin-top:0} .sec>*+*{margin-top:6px}
  .sec .guide,.sec .note,.sec .tcard{margin-top:6px}
  .card,.tcard,.relcell,.conf2,.two,.k,table.mini,.soukatsu,.guide{break-inside:avoid;page-break-inside:avoid}
  .card,.tcard,.relcell{box-shadow:none;margin-top:9px}
  .two img,.relcell img{max-height:68mm;width:auto;max-width:100%;margin:0 auto}
  .two{align-items:center}
  .conf2 img{max-height:86mm;width:auto;max-width:100%}
  .sechead{break-after:avoid;page-break-after:avoid}
}
</style></head><body><div class=wrap>
<div class=pdfpage><div class=head><h1>#216 石川大峨</h1><span class=tagi>内部用（非公開）</span><span class=pd>2026-11（先月比）／一軍・二軍 別</span></div><div class=sec><div class=sechead>今月の総括</div><div class="card soukatsu">今月は試合出場が少ない（練習期・調整中）。練習の計測値は下のカードで確認。</div></div><div class=sec><div class="card"><p class=note>今月は一軍・二軍とも出場が少なく、試合セクションは保留。練習KPIで確認。</p></div></div><div class=sec><div class=sechead>練習（レベル共通・調子の先行指標）</div><div class=card><div class="kpis"><div class=k><div class=kl>最高打球速度</div><div class=kbody><div class=kv>167<span>km/h</span></div><span class="bd down">▼ -1</span></div></div><div class=k><div class=kl>平均打球速度</div><div class=kbody><div class=kv>149<span>km/h</span></div><span class="bd down">▼ -2</span></div></div><div class=k><div class=kl>平均打球角度</div><div class=kbody><div class=kv>18.9<span class=deg>°</span></div><span class="bd down">▼ -4.0</span></div></div><div class=k><div class=kl>練習xwOBA</div><div class=kbody><div class=kv>0.493</div><span class="bd up">▲ +0.032</span></div></div></div></div></div></div><div class=pdfpage><div class="card"><p class=note>出場が少なく型判定は保留。</p></div></div>
</div></body></html>
